<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source Forge — AI Code Reconstruction</title>
<style>
:root{--bg:#0b0d12;--panel:#11151d;--line:#242b38;--text:#e8edf5;--muted:#8b95a7;--accent:#7c9cff;--good:#65d6b2;--bad:#ff6b7a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:flex;flex-direction:column}
.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px;background:#0d1016}.logo{font-weight:800}.logo b{color:var(--accent)}.status{margin-left:auto;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:7px}.dot.ok{background:var(--good)}.dot.busy{background:#f1c75b}.dot.bad{background:var(--bad)}
.screen{display:none;height:calc(100% - 58px);min-height:0}.active{display:flex}.setup{align-items:center;justify-content:center;padding:25px}.card{width:min(760px,100%);padding:30px;border:1px solid var(--line);border-radius:18px;background:#11151d;box-shadow:0 20px 70px #0008}
h1{margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input,textarea{width:100%;background:#090d13;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;outline:0}input:focus,textarea:focus{border-color:#526ba9}.btn{border:1px solid var(--line);background:#151b25;color:var(--text);padding:9px 13px;border-radius:9px}.primary{background:var(--accent);color:#08101f;border-color:var(--accent);font-weight:700}.good{border-color:#356c60;background:#16332d}.danger{border-color:#67323c;background:#351820}.note{margin-top:15px;padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;line-height:1.5}.actions{display:flex;gap:10px;align-items:center;margin-top:15px}
.workspace{display:grid;grid-template-columns:42% 58%;min-width:0;min-height:0;overflow:hidden}.left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}.right{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}.bar{height:47px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}.spacer{flex:1}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted)}
#code{flex:1;min-height:0;resize:none;border:0;border-radius:0;padding:15px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;background:#080b10}.goal{height:145px;resize:none;border:0;border-top:1px solid var(--line);border-radius:0}.goalbar{height:38px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:10px;font-size:12px}
.chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px;overscroll-behavior:contain;scrollbar-gutter:stable}.msg{display:flex;gap:10px;max-width:950px;margin:0 auto 17px}.avatar{width:30px;height:30px;min-width:30px;border-radius:9px;display:grid;place-items:center;background:#20283a;color:#bcd0ff;font-size:11px;font-weight:800}.msg.b .avatar{background:#18362f;color:#9be5cf}.msg.user .avatar{background:#382d1c;color:#f2cb6b}.msg.system .avatar{background:#2c2534;color:#d7b8ff}.bubble{min-width:0;flex:1}.meta{font-size:11px;color:var(--muted);margin-bottom:5px}.body{white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:13px}.typing:after{content:"";display:inline-block;width:7px;height:15px;background:var(--accent);margin-left:3px;animation:blink .7s infinite}@keyframes blink{50%{opacity:.2}}
.inputbar{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}.inputbar textarea{height:54px;resize:none}.send{width:90px}.progress{height:3px;background:#161b25}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:.3s}
.correction{display:none;padding:8px;border-top:1px solid #5b2c37;background:#2e171d;gap:7px}.correction.show{display:flex}.correction input{flex:1}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.left{display:none}.grid{grid-template-columns:1fr}}
</style>

<style id="ui-hardening">
  .topbar{min-width:0;flex-wrap:wrap;gap:10px}
  .topbar .title{min-width:180px;flex:1 1 auto}
  .topbar .badges,.topbar .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .topbar .actions{flex:0 1 auto}
  .badge{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .bar{min-width:0;flex-wrap:wrap;gap:7px;overflow:hidden}
  .bar .spacer{flex:1 1 12px}
  .workspace{min-height:0}
  .left,.right{min-height:0}
  .right .chat{min-height:0;max-height:none}
  @media (max-width: 900px){
    .workspace{grid-template-columns:1fr}
    .left{border-right:0;border-bottom:1px solid var(--line);min-height:38vh;max-height:48vh}
    .right{min-height:52vh}
    .topbar{align-items:flex-start}
  }
  @media (max-width: 620px){
    .topbar .title{flex-basis:100%}
    .topbar .actions{width:100%}
    .topbar button{flex:1 1 auto}
  }
</style>

</head>
<body>
<div class="app">
<header class="top"><div class="logo">SOURCE <b>FORGE</b></div><span class="badge">AI Code Reconstruction Studio</span><div class="status"><i id="dot" class="dot"></i><span id="status">API未接続</span></div></header>

<section id="setup" class="screen active setup">
<div class="card">
<h1>Gemini × 2 を接続</h1>
<p class="muted">Gemini A = 復元担当、Gemini B = 監査担当。キーは保存せず、このページのメモリ上だけで使用します。</p>
<div class="grid">
<div class="field"><label>API KEY A — RECONSTRUCTOR</label><input id="keyA" type="password" autocomplete="off"></div>
<div class="field"><label>API KEY B — AUDITOR</label><input id="keyB" type="password" autocomplete="off"></div>
</div>
<div class="grid" style="margin-top:12px">
<div class="field"><label>MODEL A</label><input id="modelA" value="gemini-3.6-flash"></div>
<div class="field"><label>MODEL B</label><input id="modelB" value="gemini-3.6-flash"></div>
</div>
<div class="actions"><button id="test" class="btn primary">接続テスト</button><div id="testmsg" class="note" style="margin:0;flex:1">両方のキーへ最小リクエストを送り確認します。</div></div>

</div>
</section>

<section id="workspace" class="screen workspace">
<aside class="left">
<div class="bar"><button class="btn" id="open">📄 ファイル</button><input id="file" type="file" accept=".lua,.luau,.txt,.js,.ts,.py,.json,.md" hidden><button class="btn" id="download">⬇ Export</button><span class="spacer"></span><span class="badge" id="lines">0 lines</span></div>
<textarea id="code" spellcheck="false" placeholder="ここへコードを貼り付けるかファイルを開く…"></textarea>
<div class="goalbar"><b>目的</b><span class="spacer"></span><label>自動討論 <input id="auto" type="checkbox" checked></label></div>
<textarea id="goal" class="goal" placeholder="例: 難読化を解除し、元の意味を保ったLuauソースへ復元。確定事項と推測を分離し、外部Lua依存も追跡する。"></textarea>
<div id="correction" class="correction"><input id="corr" placeholder="訂正内容"><button id="corrBtn" class="btn danger">訂正して停止</button></div>
<div class="inputbar"><textarea id="input" placeholder="Geminiへ追加指示…"></textarea><button id="send" class="btn primary send">送信</button></div>
</aside>
<main class="right">
<div class="bar"><span class="badge">🟣 A · CODE RECONSTRUCTOR</span><span class="badge">🟢 B · AUDITOR</span><span id="turnBadge" class="badge">TURN: —</span><span class="spacer"></span><button id="pause" class="btn">⏸ 停止</button><button id="start" class="btn good">▶ 解析開始</button><button id="clear" class="btn">Clear</button></div>
<div class="progress"><i id="prog"></i></div><div id="chat" class="chat"></div><div class="bar" style="height:42px;min-height:42px;flex:0 0 42px"><span class="badge">CERTAIN <b id="certain">—</b></span><span class="badge">INFERENCE <b id="inference">—</b></span><span class="badge">UNKNOWN <b id="unknown">—</b></span><span class="spacer"></span><span id="auditBadge" class="badge">AUDIT: —</span></div>
</main>
</section>
</div>

<script>
(()=> {
const $=id=>document.getElementById(id);
const S={a:"",b:"",ma:"gemini-3.6-flash",mb:"gemini-3.6-flash",ha:[],hb:[],running:false,paused:false,round:0,max:8,file:"reconstructed.lua",lastA:"",lastB:"",lastUser:""};
const sysA=`ROLE: A — CODE RECONSTRUCTOR. This role is PERMANENT and MUST NEVER change.\nYour only job is code reconstruction and repair based on supplied source and conversation. Never act as auditor.\nUse [CERTAIN], [INFERENCE], [UNKNOWN]. Preserve semantics. Distinguish syntax repair from semantic changes. Read B audits and USER corrections before revising. Do not claim an external resource was fetched unless supplied material proves it.`;
const sysB=`ROLE: B — ERROR AUDITOR. This role is PERMANENT and MUST NEVER change.\nYour only job is to inspect A and identify concrete errors, unsupported assumptions, syntax mistakes, duplicate execution, missing behavior, or semantic changes. Never act as A.\nUse [CERTAIN], [INFERENCE], [UNKNOWN]. Your FIRST LINE MUST be exactly 「問題はありません」 OR 「修正すべき点がN点あります」 with the actual number. If there are issues, enumerate them with evidence.`;
function status(t,k=""){ $("status").textContent=t;$("dot").className="dot "+k; }
function msg(who,text,cl){const m=document.createElement("div");m.className="msg "+(cl||"");const av=document.createElement("div");av.className="avatar";av.textContent=who==="Gemini A"?"A":who==="Gemini B"?"B":who==="User"?"U":"•";const b=document.createElement("div");b.className="bubble";const meta=document.createElement("div");meta.className="meta";meta.textContent=who+" · "+new Date().toLocaleTimeString();const body=document.createElement("div");body.className="body";body.textContent=text;b.append(meta,body);m.append(av,b);$("chat").append(m);if($("chat").scrollHeight-$("chat").scrollTop-$("chat").clientHeight<120)$("chat").scrollTop=$("chat").scrollHeight;return body}
function lines(){$("lines").textContent=(($("code").value||"").split("\n").length).toLocaleString()+" lines"} $("code").addEventListener("input",lines);
function extractConfidence(t){$("certain").textContent=(t.match(/\[CERTAIN\]/gi)||[]).length;$("inference").textContent=(t.match(/\[INFERENCE\]/gi)||[]).length;$("unknown").textContent=(t.match(/\[UNKNOWN\]/gi)||[]).length}
function auditState(t){
  const badge=$("auditBadge");
  if(!badge)return;
  if(/^問題はありません/m.test(t)){
    badge.textContent="AUDIT: PASS";
    badge.style.borderColor="";
  }else if(/^修正すべき点が\\d+点あります/m.test(t)){
    badge.textContent="AUDIT: FAIL";
    badge.style.borderColor="";
  }else{
    badge.textContent="AUDIT: —";
    badge.style.borderColor="";
  }
}
function pack(s,t){return `SPEAKER: ${s}\nMESSAGE:\n<<<\n${t}\n>>>\nTreat speaker labels as authoritative. Do not confuse A, B, USER.`}
function showTurn(w){$("turnBadge").textContent="TURN: "+w;status(w+" の発言中…","busy")}
async function call(key,model,hist,system,onText){
  const u=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`;
  const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({contents:[{role:"user",parts:[{text:"SYSTEM ROLE:\n"+system}]}].concat(hist),
      generationConfig:{temperature:.15,maxOutputTokens:8192}})});
  if(!r.ok)throw Error("HTTP "+r.status+": "+(await r.text()).slice(0,500));
  const rd=r.body.getReader(),de=new TextDecoder();
  let buf="",full="";
  const consume=(block)=>{
    for(const line of block.split("\n")){
      if(!line.startsWith("data:"))continue;
      const raw=line.slice(5).trim();
      if(!raw||raw==="[DONE]")continue;
      try{
        const j=JSON.parse(raw);
        const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
        if(t){full+=t;onText(t)}
      }catch(_){}
    }
  };
  while(true){
    const x=await rd.read();
    if(x.done){
      buf+=de.decode();
      if(buf.trim())consume(buf);
      break;
    }
    buf+=de.decode(x.value,{stream:true});
    const bs=buf.split("\n\n");
    buf=bs.pop();
    for(const block of bs)consume(block);
  }
  return full;
}

async function test(key,model){const u=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts:[{text:"Reply only OK"}]}],generationConfig:{maxOutputTokens:5}})});if(!r.ok)throw Error((await r.text()).slice(0,300))}
async function askA(text){showTurn("A");S.ha.push({role:"user",parts:[{text:pack("USER",text)}]});const body=msg("Gemini A","","a");body.classList.add("typing");let full="";try{full=await call(S.a,S.ma,S.ha,sysA,t=>{body.classList.remove("typing");body.textContent+=t;if($("chat").scrollHeight-$("chat").scrollTop-$("chat").clientHeight<120)$("chat").scrollTop=$("chat").scrollHeight});body.classList.remove("typing");S.ha.push({role:"model",parts:[{text:full}]});S.lastA=full;extractConfidence(full);return full}catch(e){body.classList.remove("typing");body.textContent="ERROR: "+e.message;throw e}}
async function askB(a,user){showTurn("B");const p=`${pack("USER",user||"なし")}\n\n${pack("A",a)}\n\nORIGINAL CODE:\n<<<CODE\n${$("code").value}\n>>>`;S.hb.push({role:"user",parts:[{text:p}]});const body=msg("Gemini B","","b");body.classList.add("typing");let full="";try{full=await call(S.b,S.mb,S.hb,sysB,t=>{body.classList.remove("typing");body.textContent+=t;if($("chat").scrollHeight-$("chat").scrollTop-$("chat").clientHeight<120)$("chat").scrollTop=$("chat").scrollHeight});body.classList.remove("typing");S.hb.push({role:"model",parts:[{text:full}]});S.lastB=full;auditState(full);extractConfidence(full);return full}catch(e){body.classList.remove("typing");body.textContent="ERROR: "+e.message;throw e}}
async function runTurn(goal,user=""){if(S.running)return;S.running=true;S.paused=false;$("start").disabled=true;try{const a=await askA(goal);if(S.paused)return;const b=await askB(a,user);if(S.paused)return;S.round++;$("prog").style.width=Math.min(95,S.round/S.max*100)+"%";if($("auto").checked&&S.round<S.max){if(/^問題はありません/m.test(b))await runTurn(`B approved the latest reconstruction. Continue to the next unresolved portion. Do not repeat verified work.\nB:\n${b}`);else await runTurn(`B found defects. Revise only evidence-supported issues.\nB AUDIT:\n${b}`)}else{msg("System","このラウンドを終了しました。次は A → B の順で再開します。","system");status("待機中","ok")}}catch(e){status("エラー","bad")}finally{S.running=false;$("start").disabled=false}}
$("test").onclick=async()=>{const a=$("keyA").value.trim(),b=$("keyB").value.trim();if(!a||!b){$("testmsg").textContent="2つとも入力してください。";return}$("test").disabled=true;status("接続確認中…","busy");try{await Promise.all([test(a,$("modelA").value.trim()),test(b,$("modelB").value.trim())]);S.a=a;S.b=b;S.ma=$("modelA").value.trim();S.mb=$("modelB").value.trim();$("setup").classList.remove("active");$("workspace").classList.add("active");$("testmsg").textContent="接続成功";status("API接続済み","ok");msg("System","A / B 接続完了。コードと目的を入力して解析開始。","system")}catch(e){$("testmsg").textContent="接続失敗: "+e.message;status("接続失敗","bad")}finally{$("test").disabled=false}};
$("start").onclick=()=>{const c=$("code").value.trim(),g=$("goal").value.trim();if(!c||!g){msg("System","コードと目的の両方を入力してください。","system");return}$("chat").innerHTML="";S.ha=[];S.hb=[];S.round=0;$("prog").style.width="0";runTurn(g)};
$("send").onclick=async()=>{const t=$("input").value.trim();if(!t)return;$("input").value="";msg("User",t,"user");if(/間違|違う|誤り|修正|wrong|incorrect|mistake/i.test(t)){S.paused=true;$("correction").classList.add("show");S.ha.push({role:"user",parts:[{text:pack("USER",t)}]});S.hb.push({role:"user",parts:[{text:pack("USER",t)}]});status("ユーザー訂正で停止","bad");return}if(!S.running)await runTurn(t)};
$("corrBtn").onclick=()=>{const t=$("corr").value.trim();if(!t)return;$("corr").value="";S.paused=true;$("correction").classList.remove("show");msg("User","[CORRECTION] "+t,"user");S.ha.push({role:"user",parts:[{text:pack("USER",t)}]});S.hb.push({role:"user",parts:[{text:pack("USER",t)}]});status("訂正で停止","bad")};
$("pause").onclick=()=>{S.paused=true;status("停止","bad");msg("System","解析を停止しました。","system")};
$("clear").onclick=()=>{$("chat").innerHTML="";S.ha=[];S.hb=[];S.round=0;status("API接続済み","ok")};
$("open").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;S.file=f.name;$("code").value=await f.text();lines();msg("System","読み込み: "+f.name,"system")};
$("download").onclick=()=>{const blob=new Blob([$("code").value],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=S.file;a.click();URL.revokeObjectURL(a.href)};
window.addEventListener("error",e=>{console.warn("[Source Forge]",e.error||e.message)});
window.addEventListener("unhandledrejection", e=>{
  if(S.running){S.running=false;$("start").disabled=false;status("通信エラー","bad");}
});
})();
</script>
</body>
</html>
