<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source Forge</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0d1117;color:#e6edf3}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* PAGE 1 */
#page1{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.setup{width:min(720px,100%);border:1px solid #30363d;border-radius:14px;background:#161b22;box-shadow:0 20px 60px #0008;padding:32px}
.brand{font-size:28px;font-weight:800;margin-bottom:8px}
.subtitle{color:#8b949e;margin-bottom:28px}
.field{margin:16px 0}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:7px}
input,select,textarea{width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#58a6ff;box-shadow:0 0 0 2px #1f6feb33}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setup-actions{display:flex;gap:10px;align-items:center;margin-top:22px}
button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px 14px}
button:hover{background:#30363d}
button.primary{background:#238636;border-color:#2ea043}
button.primary:hover{background:#2ea043}
button:disabled{opacity:.45;cursor:not-allowed}
#testStatus{font-size:13px;color:#8b949e}
#testStatus.ok{color:#3fb950}
#testStatus.bad{color:#f85149}

/* PAGE 2 */
#page2{height:100%;display:none;flex-direction:column;min-height:0}
.top{height:58px;min-height:58px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px;padding:9px 14px;overflow:hidden}
.title{font-weight:800;white-space:nowrap}
.role{font-size:11px;border:1px solid #30363d;border-radius:999px;padding:5px 9px;white-space:nowrap}
.spacer{flex:1}
.top button{padding:7px 10px}
#turn{font-size:11px;color:#8b949e;white-space:nowrap}

.main{display:grid;grid-template-columns:minmax(280px,42%) minmax(0,58%);flex:1;min-height:0;overflow:hidden}
.left{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid #30363d}
.left-head{padding:12px 14px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:10px}
.left-head span{color:#8b949e;font-size:12px}
#code{flex:1;min-height:0;resize:none;border:0;border-radius:0;line-height:1.5}
.goal-wrap{border-top:1px solid #30363d;padding:12px}
#goal{resize:none;height:70px}
.right{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px;scrollbar-gutter:stable;overscroll-behavior:contain}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.avatar{width:28px;height:28px;min-width:28px;border:1px solid #30363d;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#161b22}
.bubble{max-width:calc(100% - 40px);border:1px solid #30363d;border-radius:10px;background:#161b22;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .bubble{background:#13233a}
.msg.system .bubble{background:#1c2128;color:#8b949e}
.meta{font-size:10px;color:#8b949e;margin-bottom:6px}
.body{line-height:1.5}
.bottom{border-top:1px solid #30363d;padding:10px;display:flex;gap:8px;min-width:0}
#input{flex:1;min-width:0}
#send{white-space:nowrap}
.status{height:34px;min-height:34px;border-top:1px solid #30363d;display:flex;align-items:center;gap:10px;padding:0 12px;color:#8b949e;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:#8b949e}
.dot.busy{background:#d29922}.dot.ok{background:#3fb950}.dot.bad{background:#f85149}

@media(max-width:850px){
  .main{grid-template-columns:1fr}
  .left{border-right:0;border-bottom:1px solid #30363d;min-height:42%;max-height:50%}
  .right{min-height:50%}
  .top{overflow-x:auto}
}
@media(max-width:560px){
  #page1{padding:12px}
  .setup{padding:20px}
  .row{grid-template-columns:1fr}
  .setup-actions{flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- PAGE 1: completely separate from the analysis UI -->
<section id="page1">
  <div class="setup">
    <div class="brand">Source Forge</div>
    <div class="subtitle">Gemini connection setup</div>

    <div class="field">
      <label for="keyA">Gemini API Key A</label>
      <input id="keyA" type="password" autocomplete="off" spellcheck="false" placeholder="API key">
    </div>

    <div class="field">
      <label for="keyB">Gemini API Key B</label>
      <input id="keyB" type="password" autocomplete="off" spellcheck="false" placeholder="API key">
    </div>

    <div class="row">
      <div class="field">
        <label for="modelA">Model A</label>
        <select id="modelA">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        </select>
      </div>
      <div class="field">
        <label for="modelB">Model B</label>
        <select id="modelB">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        </select>
      </div>
    </div>

    <div class="setup-actions">
      <button id="testBtn" class="primary">接続テスト</button>
      <span id="testStatus">A/B両方の接続を確認してください</span>
    </div>
  </div>
</section>

<!-- PAGE 2: analysis UI is not present/displayed until page 1 succeeds -->
<section id="page2">
  <header class="top">
    <div class="title">Source Forge</div>
    <span class="role">A · CODE RECONSTRUCTOR</span>
    <span class="role">B · AUDITOR</span>
    <span id="turn">TURN: —</span>
    <span class="spacer"></span>
    <button id="startBtn" class="primary">解析開始</button>
    <button id="stopBtn">停止</button>
    <button id="clearBtn">Clear</button>
  </header>

  <main class="main">
    <section class="left">
      <div class="left-head"><strong>Source</strong><span id="lineCount">0 lines</span></div>
      <textarea id="code" spellcheck="false" placeholder="Lua / Luau source"></textarea>
      <div class="goal-wrap">
        <label for="goal">目的</label>
        <textarea id="goal" spellcheck="false" placeholder="コードをどう復元・修正したいか"></textarea>
      </div>
    </section>

    <section class="right">
      <div id="chat" class="chat"></div>
      <div class="bottom">
        <input id="input" type="text" placeholder="User message / correction">
        <button id="send">送信</button>
      </div>
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">待機中</span>
      </div>
    </section>
  </main>
</section>

<script>
"use strict";

const $ = id => document.getElementById(id);

const state = {
  keyA:"", keyB:"",
  modelA:"gemini-2.5-flash", modelB:"gemini-2.5-flash",
  historyA:[], historyB:[],
  running:false, stopRequested:false,
  round:0
};

const ROLE_A = `ROLE: A — CODE RECONSTRUCTOR.
This role is permanently fixed. Your only job is code reconstruction and repair.
Do not act as an auditor.
Use [CERTAIN], [INFERENCE], and [UNKNOWN] to distinguish certainty.
Preserve behavior unless an evidence-supported correction is necessary.`;

const ROLE_B = `ROLE: B — ERROR AUDITOR.
This role is permanently fixed. Your only job is to audit A's reconstruction.
Do not reconstruct the code and do not act as A.
Your first line MUST be exactly:
「問題はありません」
when there are no actionable issues, OR:
「修正すべき点がN点あります」
when there are N actionable issues.
Then explain each issue with evidence.
Use [CERTAIN], [INFERENCE], and [UNKNOWN].`;

function setStatus(text, kind=""){
  $("statusText").textContent=text;
  $("dot").className="dot "+kind;
}
function addMessage(who,text,cls=""){
  const el=document.createElement("div");
  el.className="msg "+cls;
  el.innerHTML=`<div class="avatar">${who==="Gemini A"?"A":who==="Gemini B"?"B":who==="User"?"U":"•"}</div>
    <div class="bubble"><div class="meta">${who} · ${new Date().toLocaleTimeString()}</div><div class="body"></div></div>`;
  el.querySelector(".body").textContent=text;
  $("chat").appendChild(el);
  $("chat").scrollTop=$("chat").scrollHeight;
  return el.querySelector(".body");
}

async function requestOnce(key,model){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const r=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({contents:[{role:"user",parts:[{text:"Reply only OK"}]}],generationConfig:{maxOutputTokens:8}})
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
}

async function streamGemini(key,model,history,role,onToken){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`;
  const contents=[{role:"user",parts:[{text:"SYSTEM ROLE:\\n"+role}]}].concat(history);
  const r=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({contents,generationConfig:{temperature:.15,maxOutputTokens:8192}})
  });
  if(!r.ok) throw new Error("HTTP "+r.status);

  const reader=r.body.getReader();
  const decoder=new TextDecoder();
  let buffer="",full="";

  const consume=block=>{
    for(const line of block.split("\\n")){
      if(!line.startsWith("data:")) continue;
      const raw=line.slice(5).trim();
      if(!raw||raw==="[DONE]") continue;
      try{
        const j=JSON.parse(raw);
        const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
        if(t){full+=t;onToken(t);}
      }catch(e){}
    }
  };

  while(true){
    const chunk=await reader.read();
    if(chunk.done){
      buffer+=decoder.decode();
      if(buffer.trim()) consume(buffer);
      break;
    }
    buffer+=decoder.decode(chunk.value,{stream:true});
    const blocks=buffer.split("\\n\\n");
    buffer=blocks.pop();
    for(const block of blocks) consume(block);
  }
  return full;
}

function speaker(name,text){
  return `SPEAKER: ${name}\\nMESSAGE:\\n<<<\\n${text}\\n>>>`;
}

async function runA(userText){
  if(state.stopRequested) return null;
  $("turn").textContent="TURN: A";
  setStatus("A が復元中…","busy");

  const prompt=speaker("USER",userText);
  state.historyA.push({role:"user",parts:[{text:prompt}]});

  const body=addMessage("Gemini A","");
  let full="";
  full=await streamGemini(state.keyA,state.modelA,state.historyA,ROLE_A,t=>{
    body.textContent+=t;
    $("chat").scrollTop=$("chat").scrollHeight;
  });
  state.historyA.push({role:"model",parts:[{text:full}]});
  return full;
}

async function runB(aText,userText){
  if(state.stopRequested) return null;
  $("turn").textContent="TURN: B";
  setStatus("B が監査中…","busy");

  const prompt=[
    speaker("USER",userText||"なし"),
    speaker("A",aText),
    "ORIGINAL SOURCE:\\n<<<\\n"+$("code").value+"\\n>>>"
  ].join("\\n\\n");

  state.historyB.push({role:"user",parts:[{text:prompt}]});

  const body=addMessage("Gemini B","");
  let full="";
  full=await streamGemini(state.keyB,state.modelB,state.historyB,ROLE_B,t=>{
    body.textContent+=t;
    $("chat").scrollTop=$("chat").scrollHeight;
  });
  state.historyB.push({role:"model",parts:[{text:full}]});
  return full;
}

async function startAnalysis(){
  if(state.running) return;
  const code=$("code").value.trim(), goal=$("goal").value.trim();
  if(!code||!goal){addMessage("System","コードと目的を入力してください","system");return;}

  state.running=true;
  state.stopRequested=false;
  $("startBtn").disabled=true;
  try{
    let a=await runA(goal);
    if(state.stopRequested) return;
    let b=await runB(a,"");
    if(state.stopRequested) return;

    addMessage("System","ラウンド "+(++state.round)+" 完了。次は A → B の順で続行できます。","system");
    setStatus("待機中","ok");
  }catch(e){
    addMessage("System","通信エラー: "+e.message,"system");
    setStatus("通信エラー","bad");
  }finally{
    state.running=false;
    $("startBtn").disabled=false;
  }
}

$("testBtn").onclick=async()=>{
  const a=$("keyA").value.trim(), b=$("keyB").value.trim();
  if(!a||!b){$("testStatus").textContent="A/B両方のAPIキーを入力してください";$("testStatus").className="bad";return;}
  $("testBtn").disabled=true;
  $("testStatus").textContent="A/Bを確認中…";$("testStatus").className="";
  try{
    await requestOnce(a,$("modelA").value);
    await requestOnce(b,$("modelB").value);
    state.keyA=a;state.keyB=b;
    state.modelA=$("modelA").value;state.modelB=$("modelB").value;
    $("testStatus").textContent="接続OK";
    $("testStatus").className="ok";
    $("page1").style.display="none";
    $("page2").style.display="flex";
  }catch(e){
    $("testStatus").textContent="接続失敗: "+e.message;
    $("testStatus").className="bad";
  }finally{$("testBtn").disabled=false;}
};

$("startBtn").onclick=startAnalysis;
$("stopBtn").onclick=()=>{
  state.stopRequested=true;
  state.running=false;
  $("startBtn").disabled=false;
  setStatus("停止しました","bad");
};
$("clearBtn").onclick=()=>{
  state.stopRequested=true;
  state.running=false;
  state.historyA=[];state.historyB=[];state.round=0;
  $("chat").innerHTML="";
  $("turn").textContent="TURN: —";
  setStatus("クリアしました","ok");
};
$("send").onclick=async()=>{
  const t=$("input").value.trim();if(!t)return;
  $("input").value="";
  addMessage("User",t,"user");

  // User corrections go to both histories, but B is NOT invoked here.
  state.historyA.push({role:"user",parts:[{text:speaker("USER",t)}]});
  state.historyB.push({role:"user",parts:[{text:speaker("USER",t)}]});

  if(/間違|違う|誤り|修正|wrong|incorrect|mistake/i.test(t)){
    state.stopRequested=true;
    state.running=false;
    $("startBtn").disabled=false;
    setStatus("ユーザー訂正で停止","bad");
    return;
  }

  if(!state.running) await startAnalysis();
};
$("code").addEventListener("input",()=>{
  $("lineCount").textContent=$("code").value.split("\\n").length.toLocaleString()+" lines";
});
$("input").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click();});
</script>
</body>
</html>
